server:
  port: 8081

spring:
  application:
    name: transacoes
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
  datasource:
    url: jdbc:h2:mem:transacoes;DB_CLOSE_DELAY=-1   # o banco SÓ do transacoes (ADR-001)
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8081/h2-console (JDBC URL: jdbc:h2:mem:transacoes, usuário sa)
  # Parte 2: a fila do antifraude. No Docker, o docker-compose.yml troca "localhost" por "rabbitmq".
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 2s          # RabbitMQ fora do ar: desiste em 2 s e responde 503
    publisher-confirm-type: simple  # o PublicadorDeTransacao espera o RabbitMQ confirmar cada mensagem

management:
  endpoints:
    web:
      exposure:
        include: health,info
